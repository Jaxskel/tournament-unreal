<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experimental UT4 runtime</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;object-fit:contain;outline:none}</style>
  <script type="module" src="./runtime.mjs"></script>
</head>
<body>
<!-- UE4.15 registers this legacy control during renderer creation. Fullscreen
     is handled by the parent shell to preserve the selected drawing buffer. -->
<button id="fullscreen_request" type="button" hidden aria-hidden="true" tabindex="-1"></button><canvas id="canvas" width="1920" height="1080" tabindex="0" aria-label="Experimental UT4 engine. Click to capture mouse; Escape releases mouse and opens menu."></canvas></body>
</html>
