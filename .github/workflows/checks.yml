name: Integration source checks
on: [push, pull_request, workflow_dispatch]
jobs:
  event-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./tests/launchers.ps1
  browser-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build static Vercel client
        run: GAME_GATEWAY_ORIGIN=https://game.example node ../deploy/vercel/build.mjs
